<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A company's annual reports and risk factors by year.">
    <meta name="author" content="Eric Armijos, Cody Wallen">
    <title>RiskWatch | Company</title>

    <link rel="stylesheet" href="style.css">
    <script src="data.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>

    <header class="site-header">
        <nav class="navbar">
            <a href="index.html" class="logo">RiskWatch</a>

            <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <!-- No link is "active" here: the company page is reached from Search, not the nav -->
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="search.html">Search</a></li>
                <li><a href="compare.html">Compare</a></li>
                <li><a href="watchlist.html">Watchlist</a></li>
                <li><a href="watchlist.html#notes">Notes</a></li>
            </ul>
        </nav>
    </header>

    <!-- main.js fills in the company name and details using ?ticker= from the address -->
    <section class="page-header">
        <h1 id="company-name">Company</h1>
        <p class="tagline" id="company-meta">Annual reports (10-K) by year</p>
        <button type="button" class="btn btn-secondary" id="watchlist-btn">+ Add to Watchlist</button>
        <p class="watchlist-message" id="watchlist-message"></p>
    </section>

    <main>
        <!-- Two columns: report list on the left, compare form on the right -->
        <div class="section company-layout" id="company-layout">
            <section class="report-column" id="reports">
                <h2>Annual reports (10-K)</h2>
                <!-- main.js adds one row per report, newest first -->
                <ul class="report-list" id="report-list"></ul>
            </section>

            <section class="compare-panel" id="compare-panel">
                <h2>Compare two years</h2>
                <!-- The year options come from data.js, so main.js adds them -->
                <form id="compare-form" novalidate>
                    <div class="form-group">
                        <label for="newer-year">Newer report</label>
                        <select id="newer-year" name="newer"></select>
                    </div>

                    <div class="form-group">
                        <label for="older-year">Older report</label>
                        <select id="older-year" name="older"></select>
                    </div>

                    <button type="submit" class="btn btn-primary">Compare</button>
                    <p class="error-message" id="compare-error"></p>
                </form>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="year"></span> RiskWatch &middot; Eric Armijos &amp; Cody Wallen</p>
        <p class="footer-note">Data source: SEC EDGAR (public). This prototype uses made-up sample data.</p>
    </footer>

</body>
</html>
