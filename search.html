<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search for a company by name or ticker.">
    <meta name="author" content="Eric Armijos, Cody Wallen">
    <title>RiskWatch | Search</title>

    <link rel="stylesheet" href="style.css">
    <script src="data.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>

    <header class="site-header">
        <nav class="navbar">
            <a href="index.html" class="logo">RiskWatch</a>

            <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="search.html" class="active">Search</a></li>
                <li><a href="compare.html">Compare</a></li>
                <li><a href="watchlist.html">Watchlist</a></li>
                <li><a href="watchlist.html#notes">Notes</a></li>
            </ul>
        </nav>
    </header>

    <section class="page-header">
        <h1>Search Companies</h1>
        <p class="tagline">Find a company by name or ticker</p>

        <!-- Same look as the home page form, but main.js filters the list
             while the user types, so this form never leaves the page -->
        <form class="search-form" id="search-form" novalidate>
            <label for="search-input">Company name or ticker</label>
            <div class="search-row">
                <input type="text" id="search-input" name="q" placeholder='e.g. "Northwind" or "BLPK"'>
                <button type="submit" class="btn btn-secondary">Search</button>
            </div>
        </form>
    </section>

    <main>
        <section class="section" id="results">
            <h2>Results</h2>

            <!-- main.js fills in the count and the list from data.js -->
            <p class="result-count" id="result-count"></p>
            <ul class="result-list" id="search-results"></ul>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="year"></span> RiskWatch &middot; Eric Armijos &amp; Cody Wallen</p>
        <p class="footer-note">Data source: SEC EDGAR (public). This prototype uses made-up sample data.</p>
    </footer>

</body>
</html>
